services:
  mcp-ssh-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: mcp-ssh-server:latest
    container_name: mcp-ssh-server
    restart: unless-stopped
    
    # Port mapping - can be disabled for reverse proxy setups
    ports:
      - "${EXTERNAL_PORT:-8000}:${PORT:-8000}"
    
    volumes:
      # Source code (for development without rebuilds)
      - ./src:/app/src
      
      # Configuration files (read-write for management)
      - ./config:/app/config
      
      # SSH keys (read-write for CLI to generate keys)
      - ./keys:/app/keys
      
      # Logs (persistent)
      - ./logs:/app/logs
      
      # Optional: Custom entrypoint
      # - ./docker/entrypoint.sh:/entrypoint.sh:ro
    
    environment:
      # Server settings
      - HOST=${HOST:-0.0.0.0}
      - PORT=${PORT:-8000}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      
      # Paths
      - CONFIG_DIR=${CONFIG_DIR:-/app/config}
      - KEYS_DIR=${KEYS_DIR:-/app/keys}
      - LOGS_DIR=${LOGS_DIR:-/app/logs}
      
      # Security
      - TOKEN_EXPIRY_HOURS=${TOKEN_EXPIRY_HOURS:-8760}
      
      # Rate limiting
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-true}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-60}
      - RATE_LIMIT_PER_HOUR=${RATE_LIMIT_PER_HOUR:-500}
      
      # SSH settings
      - SSH_CONNECTION_TIMEOUT=${SSH_CONNECTION_TIMEOUT:-30}
      - SSH_COMMAND_TIMEOUT=${SSH_COMMAND_TIMEOUT:-300}
      
      # Development settings
      - DEBUG=${DEBUG:-false}
      - RELOAD=${RELOAD:-false}
      
      # SSH key passphrases (if needed)
      # - PROD_SSH_PASSPHRASE=${PROD_SSH_PASSPHRASE}
      # - TEST_SSH_PASSPHRASE=${TEST_SSH_PASSPHRASE}
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M
    
    # Health check
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # Network configuration
    networks:
      - mcp-network
      # Add custom networks by setting CUSTOM_NETWORKS in .env
      # Example: CUSTOM_NETWORKS=proxy-network,monitoring-network

networks:
  mcp-network:
    driver: bridge
  
  # Custom networks can be added here
  # They will be created automatically if referenced in CUSTOM_NETWORKS
  # Example networks for common use cases:
  
  # proxy-network:
  #   external: true
  #   name: nginx-proxy-manager
  
  # monitoring-network:
  #   external: true
  #   name: monitoring-stack

